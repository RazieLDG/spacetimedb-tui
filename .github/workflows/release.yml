name: Release

# Build ready-to-run binaries for the common desktop platforms.
# This does NOT run on every commit. Trigger it by:
#   - GitHub → Actions → Release → Run workflow
#   - `gh workflow run Release`
#   - pushing a semver tag (`v1.2.3`)
#
# Without a tag the binaries are only Actions artifacts (download from
# the run). With a tag they are also attached to a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (e.g. v0.1.1). Leave empty for artifact-only build."
        required: false
        default: ""
        type: string
      publish:
        description: "Publish the GitHub Release (uncheck to keep it as a draft). Ignored if tag is empty."
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  BIN_NAME: spacetimedb-tui

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      attach_release: ${{ steps.resolve.outputs.attach_release }}
      draft: ${{ steps.resolve.outputs.draft }}
    steps:
      - name: Resolve version and release mode
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "attach_release=true" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "attach_release=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.publish }}" == "true" ]]; then
              echo "draft=false" >> "$GITHUB_OUTPUT"
            else
              echo "draft=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "attach_release=false" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          staging="${BIN_NAME}-${{ needs.meta.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$staging/"
          cp README.md LICENSE "$staging/" 2>/dev/null || true
          tar czf "${staging}.tar.gz" "$staging"
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "$env:BIN_NAME-${{ needs.meta.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\$env:BIN_NAME.exe" $staging
          if (Test-Path README.md) { Copy-Item README.md $staging }
          if (Test-Path LICENSE)   { Copy-Item LICENSE   $staging }
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ needs.meta.outputs.version }}-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub Release
        if: needs.meta.outputs.attach_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ${{ needs.meta.outputs.version }}
          draft: ${{ needs.meta.outputs.draft == 'true' }}
          generate_release_notes: true
          files: ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
